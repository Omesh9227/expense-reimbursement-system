spring.application.name=auth-service
server.port=8091

#DB config
#spring.datasource.url=jdbc:postgresql://localhost:5432/ersdb
#spring.datasource.username=postgres
#spring.datasource.password=6265316766@Omesh!

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ersdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
#auth.jwt.secret=Omesh12345678900000987654321Omesh
auth.jwt.secret=${JWT_SECRET:Omesh12345678900000987654321Omesh}
auth.jwt.expiration-ms=3600000

# Eureka
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
